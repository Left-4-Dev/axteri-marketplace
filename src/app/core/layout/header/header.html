<header class="header" [class.header--scrolled]="scrolled()">
  <div #navbar class="header__navbar">
    <a class="header__brand" routerLink="/" aria-label="Axteri, inicio">
      <img src="/assets/logos/axteri-logo.svg" alt="" />
    </a>
    <nav class="header__navigation" aria-label="Navegación principal">
      <a
        #productsTrigger
        class="header__link"
        id="header-products-trigger"
        routerLink="/"
        fragment="featured-products"
        [attr.aria-expanded]="productsMenuAvailable() ? productsMenuOpen() : null"
        [attr.aria-controls]="productsMenuAvailable() ? 'header-products-menu' : null"
        (pointerenter)="openProductsMenu($event)"
        (pointerleave)="scheduleProductsClose()"
        (focus)="openProductsMenu()"
        (focusout)="onProductsFocusOut($event)"
        (keydown.arrowdown)="enterProductsMenu($event)"
        (click)="closeProductsMenu()"
      >
        Productos
        <img class="header__chevron" src="/assets/icons/common/chevron-down.svg" alt="" />
      </a>
      <app-products-mega-menu
        id="header-products-menu"
        [hidden]="!productsMenuOpen()"
        [style.inset-inline-start.px]="productsMenuPosition().offset"
        [style.max-inline-size.px]="productsMenuPosition().maxWidth"
        [style.max-block-size.px]="productsMenuPosition().maxHeight"
        (pointerenter)="cancelProductsClose()"
        (pointerleave)="scheduleProductsClose()"
        (focusout)="onProductsFocusOut($event)"
      />
      <a class="header__link" routerLink="/" fragment="limited-offers">Oferta</a>
      <button class="header__link" type="button" disabled>Vender</button>
      <button class="header__link" type="button" disabled>Ayuda</button>
    </nav>
    <form
      class="header__search"
      role="search"
      aria-label="Buscar productos"
      (submit)="$event.preventDefault()"
    >
      <input
        #searchInput
        class="header__search-input"
        type="search"
        name="query"
        aria-label="Buscar productos"
        placeholder="Buscar productos"
        autocomplete="off"
        [hidden]="!scrolled()"
      />
      <button
        #searchButton
        class="header__search-button"
        [class.header__search-button--attention]="searchAttention()"
        type="button"
        [attr.aria-label]="scrolled() ? 'Buscar productos' : 'Ir al buscador principal'"
        (click)="requestSearch()"
        (animationend)="finishSearchAttention($event)"
        (animationcancel)="finishSearchAttention($event)"
      >
        <img src="/assets/icons/common/search.svg" alt="" />
      </button>
    </form>
  </div>

  <div class="header__actions" role="group" aria-label="Ubicación y cuenta">
    <button class="header__action header__action--location" type="button" disabled>
      <img class="header__action-icon" src="/assets/icons/header/location.svg" alt="" />
      <span class="header__action-copy">
        <span>Enviar a</span>
        <strong>Seleccionar ubicación</strong>
      </span>
      <img class="header__location-chevron" src="/assets/icons/common/chevron-down.svg" alt="" />
    </button>
    <button class="header__action" type="button" disabled>
      <img class="header__action-icon" src="/assets/icons/header/account.svg" alt="" />
      <span class="header__action-copy">
        <span>Registrarse</span>
        <strong>Iniciar sesión</strong>
      </span>
    </button>
    <button class="header__action" type="button" disabled aria-label="Mis pedidos, 1">
      <span class="header__orders-icon">
        <img class="header__action-icon" src="/assets/icons/header/orders.svg" alt="" />
        <span class="header__orders-count" aria-hidden="true">1</span>
      </span>
      <span class="header__action-copy">
        <span>Mis</span>
        <strong>Pedidos</strong>
      </span>
    </button>
  </div>
</header>
