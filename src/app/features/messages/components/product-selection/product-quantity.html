@if (quantity()) {
  <button
    class="product-quantity__step"
    type="button"
    [attr.aria-label]="'Disminuir cantidad de ' + name()"
    (click)="quantityChange.emit(quantity() - 1)"
  >
    −
  </button>
  <span class="product-quantity__value" aria-live="polite" aria-label="Cantidad">{{
    quantity()
  }}</span>
  <button
    class="product-quantity__step"
    type="button"
    [attr.aria-label]="'Aumentar cantidad de ' + name()"
    (click)="quantityChange.emit(quantity() + 1)"
  >
    +
  </button>
} @else {
  <button
    class="product-quantity__step product-quantity__step--add"
    type="button"
    [attr.aria-label]="'Agregar ' + name()"
    (click)="quantityChange.emit(1)"
  >
    + Agregar
  </button>
}
