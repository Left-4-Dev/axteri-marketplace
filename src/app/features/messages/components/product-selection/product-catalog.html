<div class="product-catalog__search" role="search">
  <span class="product-catalog__search-icon" aria-hidden="true"></span>
  <input
    #search
    class="product-catalog__search-input"
    type="search"
    name="productSearch"
    placeholder="Buscar producto o marca"
    aria-label="Buscar producto o marca"
    autocomplete="off"
    [value]="store.productSearch()"
    (input)="store.setProductSearch(search.value)"
  />
  @if (store.productSearch()) {
    <button
      class="product-catalog__search-clear"
      type="button"
      aria-label="Limpiar búsqueda de productos"
      (click)="store.setProductSearch('')"
    >
      <span aria-hidden="true">×</span>
    </button>
  }
</div>
<ul class="product-catalog__list" aria-label="Productos del proveedor">
  @for (product of store.filteredProducts(); track product.id) {
    <li class="product-catalog__item">
      <app-message-product-summary [product]="product">
        <app-message-product-quantity
          class="product-catalog__quantity"
          [name]="product.name"
          [quantity]="store.quantities().get(product.id) ?? 0"
          (quantityChange)="store.setProductQuantity(product.id, $event)"
        />
      </app-message-product-summary>
    </li>
  } @empty {
    <li class="product-catalog__item product-catalog__item--empty" role="status">
      {{
        store.products().length
          ? 'Sin resultados para esta búsqueda.'
          : 'Este proveedor aún no tiene productos en el catálogo.'
      }}
    </li>
  }
</ul>
