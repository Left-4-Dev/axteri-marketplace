<span class="thumb" aria-hidden="true">
  @if (image(); as url) {
    <img [src]="url" alt="" (error)="image.set(undefined)" />
  } @else {
    {{ product().brand.slice(0, 1) }}
  }
</span>
<span class="copy">
  @if (!compact()) {
    <span class="brand">{{ product().brand }}</span>
  }
  <strong [class.short]="compact()" [title]="product().name">{{ product().name }}</strong>
  @if (!compact() && product().priceLabel; as price) {
    <span class="price">{{ price }}</span>
  }
</span>
