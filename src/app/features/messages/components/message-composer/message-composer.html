<form
  class="message-composer"
  [class.message-composer--expanded]="isExpanded()"
  aria-label="Redactar mensaje"
  (submit)="onSubmit($event)"
>
  <button
    class="message-composer__attachment"
    type="button"
    disabled
    aria-label="Adjuntar archivo (próximamente)"
    title="Adjuntar archivo (próximamente)"
  >
    <span class="message-composer__attachment-icon" aria-hidden="true"></span>
  </button>

  <label class="message-composer__field">
    <span class="message-composer__sr-only">Escribe un mensaje</span>
    <textarea
      #textarea
      class="message-composer__textarea"
      [class.message-composer__textarea--empty]="!draft()"
      name="messageBody"
      rows="1"
      [disabled]="disabled()"
      [placeholder]="hasProducts() ? 'Nota opcional...' : 'Escribe un mensaje...'"
      [value]="draft()"
      (input)="onDraftInput($event)"
      (keydown)="onKeydown($event)"
    ></textarea>
  </label>

  <button
    class="message-composer__submit"
    type="submit"
    [disabled]="!canSubmit()"
    [attr.aria-label]="hasProducts() ? 'Enviar solicitud de productos' : 'Enviar mensaje'"
  >
    <img
      #sendIcon
      class="message-composer__send-icon"
      src="/assets/icons/messages/send.svg"
      alt=""
      hidden
      (load)="sendIcon.hidden = false"
      (error)="sendIcon.hidden = true"
    />
    <span class="message-composer__send-fallback" aria-hidden="true">→</span>
  </button>
</form>
