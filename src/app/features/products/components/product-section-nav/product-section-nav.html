<nav class="product-section-nav" aria-label="Secciones del producto">
  <ul role="list">
    @for (section of sections; track section.id) {
      <li>
        <a [routerLink]="productPath()" [fragment]="section.id" queryParamsHandling="preserve">{{
          section.label
        }}</a>
      </li>
    }
  </ul>
</nav>
