<section class="recommendations" id="recommendations" aria-labelledby="recommendations-title">
  <h2 id="recommendations-title">Sugerencias para ti</h2>
  <ul class="recommendations__products">
    @for (product of products(); track product.id) {
      <li><app-product-card [product]="product" /></li>
    }
  </ul>
  <button class="recommendations__more" type="button" disabled>Cargar más</button>
</section>
