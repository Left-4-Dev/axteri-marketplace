<section class="limited-offers" id="limited-offers" aria-labelledby="limited-offers-title">
  <h2 class="limited-offers__title" id="limited-offers-title">OFERTA POR TIEMPO LIMITADO</h2>
  <div class="limited-offers__carousel">
    <button
      class="limited-offers__arrow limited-offers__arrow--previous"
      type="button"
      aria-label="Ofertas anteriores"
      aria-controls="limited-offers-carousel"
      [hidden]="!canGoBack()"
      [disabled]="!canGoBack()"
      (click)="move(-1)"
    >
      <span aria-hidden="true"></span>
    </button>
    <div
      #viewport
      class="limited-offers__viewport"
      id="limited-offers-carousel"
      role="region"
      aria-roledescription="carrusel"
      aria-label="Productos en oferta"
      tabindex="0"
      (keydown)="onKeydown($event)"
    >
      <ul class="limited-offers__products">
        @for (product of products(); track product.id) {
          <li class="limited-offers__item">
            <app-product-card [product]="product" variant="offer" />
          </li>
        }
      </ul>
    </div>
    <button
      class="limited-offers__arrow limited-offers__arrow--next"
      type="button"
      aria-label="Ofertas siguientes"
      aria-controls="limited-offers-carousel"
      [hidden]="!canGoForward()"
      [disabled]="!canGoForward()"
      (click)="move(1)"
    >
      <span aria-hidden="true"></span>
    </button>
  </div>
</section>
